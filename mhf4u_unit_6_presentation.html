    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Base Setup */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617; display: grid; place-items: center; 
            min-height: 100vh; padding: 40px 0; font-family: 'Inter', sans-serif;
            overflow: hidden; color: #f8fafc;
        }

        /* Slide Container */
        .slide-container {
            width: 1280px; height: 720px;
            background: radial-gradient(120% 120% at 50% -10%, #1e293b 0%, #020617 100%);
            border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative; overflow: hidden; display: flex; flex-direction: column;
        }
        
        .slide-container::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 0; pointer-events: none;
        }

        /* Slide Mechanics */
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 70px);
            padding: 50px 70px; display: none; flex-direction: column; z-index: 1;
            opacity: 0; transition: opacity 0.3s ease-in-out;
        }
        .slide.active { display: flex; opacity: 1; z-index: 10; }

        /* Typography */
        h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; margin: 0; }
        .title-main { font-size: 64px; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .slide-title { font-size: 42px; color: #a855f7; border-bottom: 2px solid rgba(168, 85, 247, 0.3); padding-bottom: 12px; margin-bottom: 30px; }
        p, li { font-size: 24px; color: #cbd5e1; line-height: 1.6; }
        
        /* Layout Utilities */
        .content-center { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 100%; align-items: center; flex-grow: 1; }
        
        /* Custom Elements */
        .math-box { 
            font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: bold; color: #4ade80;
            background: rgba(0,0,0,0.4); border-left: 4px solid #4ade80; padding: 20px 30px; border-radius: 0 12px 12px 0; margin: 20px 0; display: inline-block;
        }
        .card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 30px; }
        .accent-cyan { color: #22d3ee; font-weight: bold; }
        .accent-pink { color: #f472b6; font-weight: bold; }
        .accent-yellow { color: #fbbf24; font-weight: bold; }
        
        /* Lists */
        .bullet-list { list-style: none; margin: 0; padding: 0; text-align: left; }
        .bullet-list li { position: relative; padding-left: 35px; margin-bottom: 20px; }
        .bullet-list li::before { content: '\f105'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; left: 0; top: 2px; color: #38bdf8; font-size: 24px; }

        /* Navigation Bar */
        .nav-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70px;
            background: rgba(15, 23, 42, 0.95); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 20;
        }
        .nav-btn {
            background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; color: #38bdf8;
            padding: 10px 25px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
            font-family: 'Poppins', sans-serif; font-size: 16px;
        }
        .nav-btn:hover { background: #38bdf8; color: #020617; }
        .nav-btn:disabled { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: #64748b; cursor: not-allowed; }
        .progress-text { color: #94a3b8; font-family: 'Poppins', sans-serif; font-weight: 600; letter-spacing: 2px; }
    </style>
</head>

    const presentation = document.getElementById('presentation');
    let currentSlide = 0;

    function renderSlides() {
        slideData.forEach((slide, index) => {
            const slideEl = document.createElement('div');
            slideEl.className = `slide ${index === 0 ? 'active' : ''}`;
            slideEl.id = `slide-${index}`;
            
            let html = '';
            if (slide.title) {
                html += `<h2 class="slide-title">${slide.title}</h2>`;
            }
            html += slide.content;
            
            slideEl.innerHTML = html;
            // Insert before the nav bar
            presentation.insertBefore(slideEl, document.querySelector('.nav-bar'));
        });
    }

    function changeSlide(direction) {
        document.getElementById(`slide-${currentSlide}`).classList.remove('active');
        currentSlide += direction;
        document.getElementById(`slide-${currentSlide}`).classList.add('active');
        updateNav();
    }

    function updateNav() {
        document.getElementById('slideCounter').innerText = `${currentSlide + 1} / ${slideData.length}`;
        document.getElementById('prevBtn').disabled = currentSlide === 0;
        document.getElementById('nextBtn').disabled = currentSlide === slideData.length - 1;
    }

    // Initialize
    renderSlides();
    updateNav();
</script>
